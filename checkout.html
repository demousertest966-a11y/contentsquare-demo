<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Contentsquare Demo Store</title>

<!-- ============================================================
     CONTENTSQUARE TAG GOES HERE
     Paste the snippet from Contentsquare "Install tag" (Manual method)
     right before the closing </head> tag on EVERY page.

     This page is intended to be your CONVERSION GOAL page —
     configure it as such in Contentsquare's Analysis setup.

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f7f7f9; color: #222; }
  header { background: #2b2b52; color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
  header .logo { font-size: 22px; font-weight: bold; }
  nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
  .wrap { max-width: 600px; margin: 60px auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .wrap h1 { font-size: 24px; margin-bottom: 16px; color: #2f8f4e; }
  .order-summary { border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 16px 0; margin: 20px 0; }
  .order-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #555; }
  .total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-top: 10px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #444; }
  .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .btn { display: inline-block; background: #2f8f4e; color: #fff; padding: 14px 28px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 15px; border: none; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn:hover { background: #257c40; }
  .confirmation { display: none; text-align: center; }
  .confirmation h1 { color: #2f8f4e; }
  footer { text-align: center; padding: 24px; font-size: 12px; color: #999; }
</style>
</head>
<body>

<header>
  <div class="logo">CSQ Demo Store</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="product.html">Product</a>
    <a href="checkout.html">Checkout</a>
  </nav>
</header>

<div class="wrap" id="checkout-form-view">
  <h1>Checkout</h1>
  <div class="order-summary">
    <div class="order-row"><span>Wireless Headphones x1</span><span>$49.99</span></div>
    <div class="order-row"><span>Shipping</span><span>$4.99</span></div>
    <div class="total-row"><span>Total</span><span>$54.98</span></div>
  </div>
  <div class="form-group">
    <label for="name">Full Name (test data only)</label>
    <input type="text" id="name" placeholder="Test User">
  </div>
  <div class="form-group">
    <label for="email">Email (test data only)</label>
    <input type="email" id="email" placeholder="test@example.com">
  </div>
  <button class="btn" id="place-order-btn" onclick="completeOrder()">Place Test Order</button>
</div>

<div class="wrap confirmation" id="confirmation-view">
  <h1>✓ Order Confirmed</h1>
  <p>This is a simulated conversion for Contentsquare testing purposes only.</p>
</div>

<footer>Demo site created for Contentsquare tag validation testing.</footer>

<script>
  function completeOrder() {
    document.getElementById('checkout-form-view').style.display = 'none';
    var confirmation = document.getElementById('confirmation-view');
    confirmation.style.display = 'block';
    // Marking this as a reachable "conversion" state on the page.
    // Configure this page (or the confirmation state) as your
    // Conversion Goal inside Contentsquare's Analysis setup.
  }
</script>

</body>
</html>
